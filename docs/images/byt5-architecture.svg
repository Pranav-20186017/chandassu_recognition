<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="808" viewBox="0 0 1120 808" role="img" aria-labelledby="title desc">
<title id="title">ByT5 encoder classifier</title><desc id="desc">Four poem lines are normalized and encoded as UTF-8 byte IDs with an end token. The ByT5-small encoder uses twelve transformer layers with hidden width 1472. Masked mean pooling produces one 1472-dimensional vector per line. Dropout and a linear layer produce four logits per line. Temperature calibration and softmax produce line probabilities. Their mean gives the poem probabilities.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#172b43}.title{font-size:28px;font-weight:700}.subtitle{font-size:16px;fill:#52647b}.label{font-size:18px;font-weight:700}.detail{font-size:15px;fill:#41546a}.small{font-size:14px;fill:#52647b}.arrow{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}</style>
<rect width="1120" height="808" rx="16" fill="#f8fafc"/>
<text x="48" y="48" class="title">ByT5 encoder classifier</text>
<text x="48" y="76" class="subtitle">One poem → four line predictions → one poem prediction</text>
<rect x="48" y="112" width="280" height="94" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="188.0" y="142" text-anchor="middle" class="label">Four poem lines</text>
<text x="188.0" y="169" text-anchor="middle" class="detail">Process each line separately</text>
<rect x="420" y="112" width="280" height="94" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="560.0" y="142" text-anchor="middle" class="label">Normalize text</text>
<text x="560.0" y="169" text-anchor="middle" class="detail">Unicode NFC and whitespace</text>
<rect x="792" y="112" width="280" height="94" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="932.0" y="142" text-anchor="middle" class="label">UTF-8 byte IDs</text>
<text x="932.0" y="169" text-anchor="middle" class="detail">Byte value + 3; end token 1</text>
<path d="M 328 159 H 416" class="arrow"/>
<path d="M 700 159 H 788" class="arrow"/>
<rect x="188" y="270" width="744" height="164" rx="12" fill="#eaf2ff" stroke="#a8bfe3" stroke-width="1.5"/>
<text x="560.0" y="300" text-anchor="middle" class="label">ByT5-small encoder</text>
<text x="560.0" y="327" text-anchor="middle" class="detail">12 transformer layers · Hidden width: 1,472</text>
<text x="560.0" y="350" text-anchor="middle" class="detail">Self-attention + feed-forward layers</text>
<text x="560.0" y="373" text-anchor="middle" class="detail">Pretrained encoder; all encoder weights are trainable</text>
<path d="M 932 206 V 236 H 560 V 266" class="arrow"/>
<rect x="48" y="510" width="280" height="118" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="188.0" y="540" text-anchor="middle" class="label">Masked mean pooling</text>
<text x="188.0" y="567" text-anchor="middle" class="detail">Mean of token features</text>
<text x="188.0" y="590" text-anchor="middle" class="detail">Output: 1,472 features per line</text>
<rect x="420" y="510" width="280" height="118" rx="12" fill="#eaf2ff" stroke="#a8bfe3" stroke-width="1.5"/>
<text x="560.0" y="540" text-anchor="middle" class="label">Classification layer</text>
<text x="560.0" y="567" text-anchor="middle" class="detail">Dropout: 0.2; linear: 1,472 → 4</text>
<text x="560.0" y="590" text-anchor="middle" class="detail">Output: four logits per line</text>
<rect x="792" y="510" width="280" height="118" rx="12" fill="#e8f5ef" stroke="#a6d4bf" stroke-width="1.5"/>
<text x="932.0" y="540" text-anchor="middle" class="label">Line probabilities</text>
<text x="932.0" y="567" text-anchor="middle" class="detail">Softmax(logits / temperature)</text>
<text x="932.0" y="590" text-anchor="middle" class="detail">Four classes per line</text>
<path d="M 560 434 V 468 H 188 V 506" class="arrow"/>
<path d="M 328 569 H 416" class="arrow"/>
<path d="M 700 569 H 788" class="arrow"/>
<rect x="350" y="684" width="420" height="94" rx="12" fill="#e8f5ef" stroke="#a6d4bf" stroke-width="1.5"/>
<text x="560.0" y="714" text-anchor="middle" class="label">Poem prediction</text>
<text x="560.0" y="741" text-anchor="middle" class="detail">Mean of four line probabilities</text>
<text x="560.0" y="764" text-anchor="middle" class="detail">Class with highest probability</text>
<path d="M 932 628 V 654 H 560 V 680" class="arrow"/>
<text x="48" y="800" class="small">217,663,364 parameters · Maximum: 1,024 tokens per line, including the end token · Pooling excludes padding</text>
</svg>
