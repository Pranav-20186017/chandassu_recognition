[build-system]
requires = ["setuptools==82.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chandassu-recognition"
version = "1.0.0"
description = "Reproducible character CNN and ByT5 encoder classification of four Telugu poetic metres"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
readme = "README.md"
authors = [{name = "Pranav"}]
dependencies = [
  "torch==2.8.0", "transformers==4.57.6", "numpy==1.26.4", "scipy==1.15.3",
  "scikit-learn==1.6.1", "safetensors==0.8.0", "huggingface-hub==0.36.2",
  "fastapi==0.136.1", "uvicorn==0.36.1",
]

[project.optional-dependencies]
cpu = ["torch==2.8.0"]
cuda = ["torch==2.8.0"]

[dependency-groups]
dev = ["pytest==9.0.2", "ruff==0.16.3", "httpx==0.28.1"]

[tool.uv]
conflicts = [[{extra = "cpu"}, {extra = "cuda"}]]

[tool.uv.sources]
torch = [
  {index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'darwin'"},
  {index = "pytorch-cu128", extra = "cuda", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'"},
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chandassu = ["web/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
