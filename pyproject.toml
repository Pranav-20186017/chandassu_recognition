[build-system]
requires = ["setuptools==82.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chandassu-recognition"
version = "0.1.0"
description = "Leakage-safe Telugu poetic metre classification"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
train = ["torch==2.8.0", "transformers==4.57.6", "sentencepiece==0.2.2", "protobuf==5.29.6"]
scrape = ["httpx==0.28.1", "beautifulsoup4==4.14.3"]
notebook = ["jupyterlab==4.4.9", "ipykernel==7.4.0", "matplotlib==3.10.8"]
plots = ["matplotlib==3.10.8"]
analysis = ["scikit-learn==1.6.1"]
sequence = ["torch==2.8.0", "regex==2026.9.29"]

[dependency-groups]
dev = ["pytest==9.0.2"]

[project.scripts]
chandassu = "chandassu.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
